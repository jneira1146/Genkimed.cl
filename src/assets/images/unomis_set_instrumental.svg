<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="cardShadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="1400" height="960" fill="url(#bgGrad2)" />
  <rect x="0" y="0" width="1400" height="8" fill="#0d9488" />

  <!-- Top Header Bar -->
  <g transform="translate(50, 45)">
    <text x="0" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#0f172a">Sistema De Fijación UNOMIS</text>
    <text x="0" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#0f766e">Unomis Set Instrumental Multipropósito</text>

    <!-- Logo Badges -->
    <g transform="translate(1000, 0)">
      <rect x="0" y="0" width="300" height="65" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow2)" />
      <rect x="18" y="16" width="32" height="32" rx="8" fill="#581c87" />
      <circle cx="34" cy="32" r="5" fill="#ffffff" />
      <text x="58" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#1e1b4b">Unomis</text>
      <line x1="150" y1="15" x2="150" y2="50" stroke="#cbd5e1" stroke-width="1" />
      <text x="165" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0f172a">Maff<tspan fill="#0284c7">Health</tspan></text>
    </g>
  </g>

  <!-- Main Container Grid -->
  <!-- Container Box Lid & Trays -->
  <g transform="translate(50, 140)">
    <!-- Box Cover -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="380" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" filter="url(#cardShadow2)" />
      <!-- Corner bumpers -->
      <rect x="10" y="10" width="30" height="30" rx="6" fill="#64748b" />
      <rect x="180" y="10" width="30" height="30" rx="6" fill="#64748b" />
      <rect x="10" y="340" width="30" height="30" rx="6" fill="#64748b" />
      <rect x="180" y="340" width="30" height="30" rx="6" fill="#64748b" />
      <!-- Perforations pattern -->
      <g fill="#94a3b8" opacity="0.4">
        <circle cx="50" cy="80" r="4"/><circle cx="80" cy="80" r="4"/><circle cx="110" cy="80" r="4"/><circle cx="140" cy="80" r="4"/><circle cx="170" cy="80" r="4"/>
        <circle cx="50" cy="110" r="4"/><circle cx="80" cy="110" r="4"/><circle cx="110" cy="110" r="4"/><circle cx="140" cy="110" r="4"/><circle cx="170" cy="110" r="4"/>
        <circle cx="50" cy="270" r="4"/><circle cx="80" cy="270" r="4"/><circle cx="110" cy="270" r="4"/><circle cx="140" cy="270" r="4"/><circle cx="170" cy="270" r="4"/>
        <circle cx="50" cy="300" r="4"/><circle cx="80" cy="300" r="4"/><circle cx="110" cy="300" r="4"/><circle cx="140" cy="300" r="4"/><circle cx="170" cy="300" r="4"/>
      </g>
      <!-- Logo badge center -->
      <rect x="40" y="150" width="140" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" />
      <circle cx="65" cy="180" r="8" fill="#581c87" />
      <text x="82" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#1e1b4b">Unomis</text>
      <text x="110" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#64748b" text-anchor="middle">MIS Spinal Fixation System</text>
      <text x="110" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Contenedor Autoclavable</text>
    </g>

    <!-- Tray 1: Green/Teal Ergonomic Handles -->
    <g transform="translate(250, 0)">
      <rect x="0" y="0" width="510" height="380" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#cardShadow2)" />
      <!-- Silicone grid layout -->
      <rect x="15" y="15" width="480" height="350" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
      
      <!-- Green T-handle 1 -->
      <g transform="translate(40, 40)">
        <path d="M 0 15 C 0 5, 20 0, 60 0 C 100 0, 120 5, 120 15 C 120 25, 100 30, 60 30 C 20 30, 0 25, 0 15 Z" fill="#0d9488" stroke="#0f766e" stroke-width="2" />
        <rect x="52" y="30" width="16" height="55" fill="#94a3b8" stroke="#475569" />
        <text x="60" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">UNOMIS</text>
      </g>

      <!-- Green T-handle 2 -->
      <g transform="translate(40, 150)">
        <path d="M 0 15 C 0 5, 20 0, 60 0 C 100 0, 120 5, 120 15 C 120 25, 100 30, 60 30 C 20 30, 0 25, 0 15 Z" fill="#0d9488" stroke="#0f766e" stroke-width="2" />
        <rect x="52" y="30" width="16" height="55" fill="#94a3b8" stroke="#475569" />
      </g>

      <!-- Precision driver shafts -->
      <g transform="translate(190, 40)">
        <rect x="0" y="15" width="270" height="12" rx="4" fill="#cbd5e1" stroke="#64748b" />
        <rect x="0" y="45" width="270" height="12" rx="4" fill="#cbd5e1" stroke="#64748b" />
        <rect x="0" y="75" width="270" height="12" rx="4" fill="#cbd5e1" stroke="#64748b" />
        <rect x="0" y="105" width="270" height="12" rx="4" fill="#cbd5e1" stroke="#64748b" />
        <rect x="0" y="135" width="270" height="12" rx="4" fill="#cbd5e1" stroke="#64748b" />
        <rect x="0" y="170" width="270" height="16" rx="6" fill="#94a3b8" stroke="#475569" />
        <rect x="0" y="210" width="270" height="16" rx="6" fill="#94a3b8" stroke="#475569" />
        <rect x="0" y="250" width="270" height="20" rx="6" fill="#64748b" stroke="#334155" />
      </g>

      <text x="255" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Bandeja Superior: Mangos en T Ergonómicos y Destornilladores</text>
    </g>

    <!-- Tray 2: Blue-handled Instruments -->
    <g transform="translate(790, 0)">
      <rect x="0" y="0" width="510" height="380" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#cardShadow2)" />
      <rect x="15" y="15" width="480" height="350" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
      
      <!-- Blue handles -->
      <g transform="translate(40, 50)">
        <rect x="0" y="0" width="45" height="110" rx="12" fill="#0284c7" stroke="#0369a1" stroke-width="2" />
        <rect x="16" y="110" width="14" height="160" fill="#cbd5e1" stroke="#64748b" />
      </g>
      <g transform="translate(400, 30)">
        <rect x="0" y="0" width="45" height="80" rx="12" fill="#0284c7" stroke="#0369a1" stroke-width="2" />
        <rect x="16" y="80" width="14" height="220" fill="#cbd5e1" stroke="#64748b" />
      </g>

      <!-- Dilatators and sleeves -->
      <g transform="translate(110, 50)">
        <rect x="0" y="20" width="260" height="18" rx="6" fill="#cbd5e1" stroke="#64748b" />
        <rect x="0" y="60" width="260" height="16" rx="6" fill="#cbd5e1" stroke="#64748b" />
        <rect x="0" y="100" width="260" height="14" rx="6" fill="#cbd5e1" stroke="#64748b" />
        <rect x="0" y="140" width="260" height="22" rx="6" fill="#94a3b8" stroke="#475569" />
        <rect x="0" y="190" width="260" height="26" rx="8" fill="#64748b" stroke="#334155" />
      </g>

      <text x="255" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Bandeja Inferior: Cánulas Dilatadoras Coaxiales y Calibres MIS</text>
    </g>
  </g>

  <!-- Bottom Showcase Cards: Puncture Needle, Kirschner Guide Wire & Reduction Pliers -->
  <g transform="translate(50, 580)">
    <!-- Card 1: Trocar & Cannula Needle -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="410" height="230" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow2)" />
      <rect x="20" y="16" width="370" height="32" rx="6" fill="#f0f9ff" />
      <text x="35" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#0369a1">AGUJA TROCAR CON MANGO EN T</text>
      
      <!-- Graphic -->
      <g transform="translate(50, 75)">
        <!-- Blue T handle -->
        <rect x="20" y="10" width="80" height="25" rx="8" fill="#0284c7" stroke="#0369a1" />
        <rect x="52" y="35" width="16" height="20" fill="#94a3b8" />
        <line x1="60" y1="55" x2="60" y2="120" stroke="#475569" stroke-width="5" stroke-linecap="round" />
        <polygon points="56,120 64,120 60,132" fill="#334155" />
      </g>
      <text x="180" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Punción Percutánea Segura</text>
      <text x="180" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#475569">• Aguja trocar biselada de penetración suave</text>
      <text x="180" y="133" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#475569">• Compatible con alambres guía Kirschner</text>
      <text x="180" y="151" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#475569">• Cánula exterior graduada en milímetros</text>
    </g>

    <!-- Card 2: Kirschner Wire -->
    <g transform="translate(440, 0)">
      <rect x="0" y="0" width="410" height="230" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow2)" />
      <rect x="20" y="16" width="370" height="32" rx="6" fill="#f5f3ff" />
      <text x="35" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#5b21b6">ALAMBRES GUÍA / AGUJAS GUÍAS</text>

      <g transform="translate(40, 70)">
        <line x1="20" y1="120" x2="100" y2="20" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
        <line x1="30" y1="120" x2="110" y2="20" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 4" />
      </g>
      <text x="180" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Agujas Guías Patentadas</text>
      <text x="180" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#475569">• Alambres de nitinol / acero con marcas láser</text>
      <text x="180" y="133" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#475569">• Conducción exacta del tornillo canulado</text>
      <text x="180" y="151" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#475569">• Prevención de desviación o falso trayecto</text>
    </g>

    <!-- Card 3: Reduction / Compression Forceps -->
    <g transform="translate(880, 0)">
      <rect x="0" y="0" width="420" height="230" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow2)" />
      <rect x="20" y="16" width="380" height="32" rx="6" fill="#f0fdf4" />
      <text x="35" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#15803d">PINZA COMPRESORA / REDUCTORA</text>

      <g transform="translate(40, 65)">
        <path d="M 20 120 Q 30 70 50 60 L 60 20 Q 70 60 80 120" fill="none" stroke="#64748b" stroke-width="5" />
        <circle cx="55" cy="50" r="6" fill="#334155" />
        <line x1="30" y1="90" x2="70" y2="90" stroke="#94a3b8" stroke-width="3" />
      </g>
      <text x="170" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Control Biomecánico Fino</text>
      <text x="170" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#475569">• Compresión y distracción controlada</text>
      <text x="170" y="133" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#475569">• Asiento micrométrico de barra 5.5 mm</text>
      <text x="170" y="151" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#475569">• Acabado antirreflejo para quirófano</text>
    </g>
  </g>

  <!-- Big Slogan Banner at bottom -->
  <g transform="translate(50, 840)">
    <rect x="0" y="0" width="1300" height="65" rx="14" fill="#0f172a" />
    <text x="650" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
      “Instrumentación avanzada, intuitiva y eficiente.”
    </text>
  </g>

  <!-- Footer -->
  <g transform="translate(50, 935)">
    <text x="0" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#64748b">SET QUIRÚRGICO ESTERILIZABLE • MAFFHEALTH • GENKIMED SpA CHILE</text>
  </g>
</svg>