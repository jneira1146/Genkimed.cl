<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients for Titanium Implants -->
    <linearGradient id="blueTitanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <linearGradient id="goldTitanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="80%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <linearGradient id="vertebraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="45%" stop-color="#e2e8f0" />
      <stop offset="85%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Clean Medical White Canvas -->
  <rect width="1200" height="850" fill="#ffffff" />

  <!-- HEADER -->
  <g transform="translate(45, 45)">
    <!-- Title in Official Warm Amber -->
    <text x="0" y="32" fill="#E67E22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="30" letter-spacing="-0.5">
      Sistema MIS para Restauración de Fracturas Vertebrales y Aumentación
    </text>

    <!-- Brand Logo Left: Ver3 VERTRES -->
    <g transform="translate(0, 55)">
      <!-- 3 dots emblem in rounded rect -->
      <rect x="0" y="0" width="38" height="38" rx="10" fill="#1e293b" />
      <circle cx="19" cy="13" r="3.5" fill="#ffffff" />
      <circle cx="13" cy="24" r="3.5" fill="#ffffff" />
      <circle cx="25" cy="24" r="3.5" fill="#ffffff" />
      
      <!-- Text Ver3 -->
      <text x="46" y="24" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="-0.5">
        Ver<tspan fill="#0f172a">3</tspan>
      </text>
      <!-- VERTRES subtitle -->
      <text x="47" y="36" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" letter-spacing="1.5">
        VERTRES
      </text>
    </g>

    <!-- Brand Logo Right: MaffHealth -->
    <g transform="translate(930, 0)">
      <!-- Ribbon Symbol -->
      <path d="M 12 28 C 4 14 20 0 32 8 C 40 14 36 26 44 34 C 52 40 64 30 56 18" stroke="#E67E22" stroke-width="7" stroke-linecap="round" fill="none" />
      <path d="M 32 8 C 42 0 58 12 50 24 C 42 32 48 44 38 50 C 28 54 18 44 24 34" stroke="#8b5cf6" stroke-width="7" stroke-linecap="round" fill="none" />
      <text x="68" y="35" fill="#1e293b" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="26">
        Maff<tspan fill="#0284c7">Health</tspan>
      </text>
    </g>
  </g>

  <!-- MATERIAL ANNOTATION -->
  <text x="45" y="195" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="17">
    Material: Ti-6Al-4V ELI
  </text>

  <!-- EXPANSION IMPLANTE SECTION -->
  <g transform="translate(45, 230)">
    
    <!-- 1. Closed Blue Implant -->
    <g transform="translate(0, 30)">
      <!-- Cylindrical implant body -->
      <rect x="0" y="0" width="135" height="34" rx="6" fill="url(#blueTitanium)" stroke="#0284c7" stroke-width="1.5" />
      <!-- Slots and laser cuts -->
      <rect x="18" y="12" width="35" height="10" rx="3" fill="#0c4a6e" />
      <rect x="65" y="12" width="22" height="10" rx="3" fill="#0c4a6e" />
      <circle cx="102" cy="17" r="4" fill="#0c4a6e" />
      <line x1="120" y1="4" x2="120" y2="30" stroke="#7dd3fc" stroke-width="1.5" />
      <line x1="126" y1="6" x2="126" y2="28" stroke="#7dd3fc" stroke-width="1.5" />
      <!-- Label below -->
      <text x="100" y="60" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" text-anchor="middle">
        Expansion Implante
      </text>
    </g>

    <!-- Arrow to Expanded -->
    <g transform="translate(160, 48)">
      <line x1="0" y1="0" x2="80" y2="0" stroke="#0f172a" stroke-width="2.5" />
      <polygon points="80,-5 90,0 80,5" fill="#0f172a" />
    </g>

    <!-- 2. Oblique View: Expanding Tripod Wings -->
    <g transform="translate(280, 0)">
      <!-- Shaft -->
      <rect x="75" y="40" width="45" height="14" rx="2" fill="url(#blueTitanium)" />
      <!-- Upper strut -->
      <polygon points="5,48 55,0 75,42" fill="url(#blueTitanium)" stroke="#0369a1" stroke-width="1" />
      <polygon points="12,46 52,8 68,40" fill="#ffffff" />
      <!-- Lower struts in perspective -->
      <polygon points="5,48 65,95 82,50" fill="url(#blueTitanium)" stroke="#0369a1" stroke-width="1" />
      <polygon points="12,50 60,86 74,52" fill="#ffffff" />
    </g>

    <!-- 3. Front View: Tripod Angles 150° and 105° -->
    <g transform="translate(520, -10)">
      <!-- Top angle text -->
      <text x="50" y="0" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" text-anchor="middle">
        150º
      </text>
      <!-- Arc indicator for 150 -->
      <path d="M 28 20 A 28 28 0 0 1 72 20" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="2,2" />

      <!-- Central hub -->
      <circle cx="50" cy="65" r="14" fill="url(#blueTitanium)" stroke="#0284c7" stroke-width="2" />
      <circle cx="50" cy="65" r="6" fill="#ffffff" />

      <!-- Top wing (12 o'clock) -->
      <g transform="translate(38, 10)">
        <rect x="0" y="0" width="24" height="48" rx="10" fill="url(#blueTitanium)" stroke="#0284c7" stroke-width="2" />
        <rect x="6" y="8" width="12" height="30" rx="6" fill="#ffffff" />
      </g>

      <!-- Bottom-Left wing (around 7 o'clock, 105° from top) -->
      <g transform="rotate(115, 50, 65) translate(38, 10)">
        <rect x="0" y="0" width="24" height="48" rx="10" fill="url(#blueTitanium)" stroke="#0284c7" stroke-width="2" />
        <rect x="6" y="8" width="12" height="30" rx="6" fill="#ffffff" />
      </g>

      <!-- Bottom-Right wing (around 5 o'clock, 105° from top) -->
      <g transform="rotate(-115, 50, 65) translate(38, 10)">
        <rect x="0" y="0" width="24" height="48" rx="10" fill="url(#blueTitanium)" stroke="#0284c7" stroke-width="2" />
        <rect x="6" y="8" width="12" height="30" rx="6" fill="#ffffff" />
      </g>

      <!-- Bottom angle labels -->
      <text x="-15" y="145" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="15">
        105º
      </text>
      <text x="95" y="145" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="15">
        105º
      </text>

      <!-- Vertical Dimension Arrow (Height) -->
      <g transform="translate(150, 10)">
        <line x1="0" y1="0" x2="0" y2="120" stroke="#0f172a" stroke-width="2" />
        <polygon points="-4,6 0,0 4,6" fill="#0f172a" />
        <polygon points="-4,114 0,120 4,114" fill="#0f172a" />
      </g>
    </g>

    <!-- 4. OFFICIAL TABLE: DIÁMETROS Y ALTURAS -->
    <g transform="translate(730, 20)">
      <!-- Outer Table Border -->
      <rect x="0" y="0" width="380" height="74" fill="#ffffff" stroke="#000000" stroke-width="1.8" />

      <!-- Row 1: Diàmetro sin expansión -->
      <line x1="0" y1="37" x2="380" y2="37" stroke="#000000" stroke-width="1.8" />
      <!-- Vertical Columns -->
      <line x1="170" y1="0" x2="170" y2="74" stroke="#000000" stroke-width="1.8" />
      <line x1="275" y1="0" x2="275" y2="74" stroke="#000000" stroke-width="1.8" />

      <!-- Cell 1,1: Label -->
      <text x="12" y="24" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14">
        Diàmetro sin expansiòn
      </text>

      <!-- Cell 1,2: 5.0 mm (Yellow background #FFFD38) -->
      <rect x="170" y="0" width="105" height="37" fill="#ffff00" stroke="#000000" stroke-width="1.8" />
      <text x="222" y="25" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" text-anchor="middle">
        5.0 mm
      </text>

      <!-- Cell 1,3: 5.8 mm (Cyan background #00B0F0) -->
      <rect x="275" y="0" width="105" height="37" fill="#00b0f0" stroke="#000000" stroke-width="1.8" />
      <text x="327" y="25" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" text-anchor="middle">
        5.8 mm
      </text>

      <!-- Cell 2,1: Altuta Expandido -->
      <text x="12" y="61" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14">
        Altuta Expandido
      </text>

      <!-- Cell 2,2: 15 mm (Yellow) -->
      <rect x="170" y="37" width="105" height="37" fill="#ffff00" stroke="#000000" stroke-width="1.8" />
      <text x="222" y="62" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" text-anchor="middle">
        15 mm
      </text>

      <!-- Cell 2,3: 17 mm (Cyan) -->
      <rect x="275" y="37" width="105" height="37" fill="#00b0f0" stroke="#000000" stroke-width="1.8" />
      <text x="327" y="62" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" text-anchor="middle">
        17 mm
      </text>
    </g>

  </g>

  <!-- DIVIDER LINE -->
  <line x1="45" y1="460" x2="1155" y2="460" stroke="#f1f5f9" stroke-width="2" />

  <!-- SURGICAL PROCEDURE ON VERTEBRAE (4 STEPS) -->
  <g transform="translate(45, 500)">
    
    <!-- Step 1: Transpedicular Trajectory (Axial View) -->
    <g transform="translate(40, 20)">
      <!-- Vertebra Superior Cross-section -->
      <path d="M 50 140 C 30 140 10 120 10 90 C 10 65 35 55 50 50 C 65 40 70 20 85 20 C 100 20 105 40 120 50 C 135 55 160 65 160 90 C 160 120 140 140 120 140 Z" fill="url(#vertebraGrad)" stroke="#94a3b8" stroke-width="1.5" />
      <!-- Spinal canal -->
      <ellipse cx="85" cy="115" rx="24" ry="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
      <!-- Transpedicular Red Trajectory Arrow -->
      <line x1="150" y1="45" x2="85" y2="125" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,4" />
      <polygon points="85,125 94,115 88,112" fill="#ef4444" />
      
      <text x="85" y="185" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" text-anchor="middle">
        1. Abordaje Transpedicular
      </text>
    </g>

    <!-- Transition Arrow 1 -->
    <g transform="translate(230, 90)">
      <line x1="0" y1="0" x2="35" y2="0" stroke="#0f172a" stroke-width="2" />
      <polygon points="35,-4 42,0 35,4" fill="#0f172a" />
    </g>

    <!-- Step 2: Cannula & Closed Implant Insertion -->
    <g transform="translate(290, 20)">
      <!-- Vertebra Sagittal/Oblique View -->
      <path d="M 20 120 C 10 100 20 50 50 40 C 90 30 130 35 150 55 C 165 75 160 115 140 130 C 100 145 50 140 20 120 Z" fill="url(#vertebraGrad)" stroke="#94a3b8" stroke-width="1.5" />
      <!-- Pedicle and working cannula -->
      <rect x="70" y="65" width="105" height="14" rx="2" transform="rotate(-18, 70, 65)" fill="#cbd5e1" stroke="#64748b" stroke-width="1.2" />
      <!-- Blue Closed Implant inside vertebral body -->
      <rect x="45" y="76" width="38" height="12" rx="3" transform="rotate(-18, 45, 76)" fill="url(#blueTitanium)" stroke="#0284c7" />
      
      <text x="90" y="185" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" text-anchor="middle">
        2. Inserción Intracorporal
      </text>
    </g>

    <!-- Transition Arrow 2 -->
    <g transform="translate(510, 90)">
      <line x1="0" y1="0" x2="35" y2="0" stroke="#0f172a" stroke-width="2" />
      <polygon points="35,-4 42,0 35,4" fill="#0f172a" />
    </g>

    <!-- Step 3: 3D Tripod Expansion (Restoring Height) -->
    <g transform="translate(570, 20)">
      <!-- Vertebra expanded (height restored) -->
      <path d="M 20 125 C 10 95 20 40 50 30 C 95 20 135 25 155 50 C 170 75 165 120 140 135 C 100 150 50 145 20 125 Z" fill="url(#vertebraGrad)" stroke="#94a3b8" stroke-width="1.5" />
      <!-- Delivery shaft -->
      <rect x="75" y="70" width="100" height="12" rx="2" transform="rotate(-18, 75, 70)" fill="#cbd5e1" stroke="#64748b" stroke-width="1.2" />
      <!-- Expanded Tripod Wings lifting upper and lower endplates -->
      <g transform="translate(40, 50)">
        <polygon points="5,35 25,5 35,32" fill="url(#blueTitanium)" stroke="#0284c7" stroke-width="1.5" />
        <polygon points="5,35 30,65 38,36" fill="url(#blueTitanium)" stroke="#0284c7" stroke-width="1.5" />
      </g>
      
      <text x="90" y="185" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" text-anchor="middle">
        3. Expansión Tridimensional
      </text>
    </g>

    <!-- Transition Arrow 3 -->
    <g transform="translate(790, 90)">
      <line x1="0" y1="0" x2="35" y2="0" stroke="#0f172a" stroke-width="2" />
      <polygon points="35,-4 42,0 35,4" fill="#0f172a" />
    </g>

    <!-- Step 4: PMMA Cement Augmentation Interlocking Implant -->
    <g transform="translate(850, 20)">
      <!-- Vertebra restored -->
      <path d="M 20 125 C 10 95 20 40 50 30 C 95 20 135 25 155 50 C 170 75 165 120 140 135 C 100 150 50 145 20 125 Z" fill="url(#vertebraGrad)" stroke="#94a3b8" stroke-width="1.5" />
      <!-- Cement injection cannula -->
      <rect x="75" y="70" width="100" height="12" rx="2" transform="rotate(-18, 75, 70)" fill="#cbd5e1" stroke="#64748b" stroke-width="1.2" />
      <!-- PMMA Bone Cement Cloud around implant -->
      <ellipse cx="52" cy="85" rx="30" ry="24" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.95" />
      <!-- Cement texture stippling -->
      <circle cx="42" cy="78" r="3" fill="#cbd5e1" />
      <circle cx="58" cy="82" r="3.5" fill="#cbd5e1" />
      <circle cx="50" cy="94" r="2.8" fill="#94a3b8" />
      <circle cx="62" cy="72" r="2.5" fill="#94a3b8" />
      <circle cx="36" cy="90" r="3" fill="#cbd5e1" />
      <!-- Embedded titanium struts -->
      <g transform="translate(42, 58)">
        <polygon points="2,25 18,5 24,24" fill="url(#blueTitanium)" opacity="0.85" />
        <polygon points="2,25 20,46 26,26" fill="url(#blueTitanium)" opacity="0.85" />
      </g>
      
      <text x="90" y="185" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" text-anchor="middle">
        4. Inyección Cemento PMMA
      </text>
    </g>

  </g>

  <!-- FOOTER BADGE -->
  <g transform="translate(45, 790)">
    <text x="0" y="20" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">
      Ver3® Vertres • Fabricado en Titanio Grado Médico Ti-6Al-4V ELI • Distribución Oficial MaffHealth / Genkimed SpA
    </text>
  </g>

</svg>
